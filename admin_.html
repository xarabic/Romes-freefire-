<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة صناع المحتوى — FreeFire Rooms</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#070a10;color:#fff}.wrap{max-width:1120px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px}.muted{color:#8d98aa;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{background:#111722;border:1px solid #202b3b;border-radius:17px;padding:15px}.stat span{color:#8d98aa;font-size:12px}.stat b{display:block;font-size:25px;margin-top:6px}.card{background:#101620;border:1px solid #222d3d;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.12)}.head{display:flex;gap:16px;align-items:center}.avatar{width:105px;height:105px;border-radius:20px;object-fit:cover;background:#1b2432;border:2px solid #ff8a00;flex:none}.name{font-size:20px;font-weight:900}.tag{color:#929dae;font-size:13px;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:17px 0}.item{background:#090e16;border:1px solid #172130;border-radius:13px;padding:11px;font-size:13px;min-width:0}.item b{display:block;color:#8d98aa;margin-bottom:6px;font-size:11px}.bio{white-space:pre-wrap;line-height:1.7;color:#d6dbe3}.creator-photo{display:block;width:190px;height:190px;border-radius:24px;object-fit:cover;background:#1b2432;border:3px solid #ff8a00;margin-top:9px}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.pending{background:#3b2b08;color:#ffc44d}.approved{background:#07351f;color:#35df86}.rejected{background:#3b1012;color:#ff7b80}.removed{background:#252b34;color:#aeb7c4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.approve{background:#20c56b;color:#06140d}.reject{background:#e5484d;color:#fff}.delete{background:#6d2024;color:#fff}.refresh{background:#202a39;color:#fff}.badge-box{margin-top:16px;padding:15px;border-radius:18px;background:linear-gradient(135deg,rgba(255,138,0,.10),rgba(255,255,255,.03));border:1px solid rgba(255,138,0,.22)}.badge-title{font-weight:900;margin-bottom:10px}.badge-row{display:flex;gap:7px;flex-wrap:wrap}.badge-btn{background:#151d29;color:#dce2ea;border:1px solid #2b3748}.badge-btn.active{background:linear-gradient(135deg,#ffcf40,#ff7a00);color:#111;border-color:#ffb000}.socials{display:flex;gap:7px;flex-wrap:wrap}.social-link{display:inline-block;background:#182130;color:#fff;text-decoration:none;padding:8px 10px;border-radius:10px;font-size:12px}.section{margin-top:28px}.section h2{font-size:18px;margin:0 0 10px}.empty{text-align:center;padding:45px;color:#8d98aa;background:#101620;border-radius:20px}.login{max-width:430px;margin:12vh auto;background:#111722;border:1px solid #263144;border-radius:22px;padding:28px}.login input{width:100%;padding:13px;margin:12px 0;background:#080b12;border:1px solid #303b4e;color:#fff;border-radius:11px;outline:none}.login button{width:100%;background:#ff9f1c}.hidden{display:none!important}.small-note{font-size:11px;color:#7e899a;margin-top:7px;line-height:1.6}.danger-note{color:#ff8b8b;font-size:11px;margin-top:8px}@media(max-width:650px){.wrap{padding:13px}.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start}.avatar{width:82px;height:82px}.name{font-size:17px}.creator-photo{width:160px;height:160px}}
</style>
</head>
<body>
<div id="login" class="login">
<h2>🔐 إدارة صنّاع المحتوى</h2><p class="muted">لوحة منفصلة عن الموقع — لا تظهر للزوار.</p>
<input id="pass" type="password" placeholder="رمز الإدارة" onkeydown="if(event.key==='Enter')unlock()">
<button class="btn" onclick="unlock()">دخول الإدارة</button><p id="err" style="color:#ff6b6b"></p>
</div>

<div id="app" class="wrap hidden">
  <div class="top"><div><h1>🎥 إدارة صنّاع المحتوى</h1><div class="muted">الطلبات، الصور، معلومات التواصل، والتوثيق في مكان واحد.</div></div><button class="btn refresh" onclick="loadApps()">🔄 تحديث</button></div>
  <div class="stats">
    <div class="stat"><span>طلبات معلقة</span><b id="pending">0</b></div>
    <div class="stat"><span>صنّاع مقبولون</span><b id="approved">0</b></div>
    <div class="stat"><span>طلبات مرفوضة</span><b id="rejected">0</b></div>
    <div class="stat"><span>صنّاع موثّقون</span><b id="verified">0</b></div>
  </div>
  <div id="list"><div class="empty">جاري تحميل الطلبات…</div></div>
  <div class="section"><h2>👑 صناع المحتوى الحاليون</h2><div id="creatorsList"><div class="empty">جاري تحميل صناع المحتوى…</div></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyB2Hf_5AyhDUzbw8I2hk5hDatSj2J7Ly_Y",authDomain:"freefire-community-efb6c.firebaseapp.com",projectId:"freefire-community-efb6c",storageBucket:"freefire-community-efb6c.firebasestorage.app",messagingSenderId:"69980561331",appId:"1:69980561331:web:88fdc24bcb63e04fa3f5c6",databaseURL:"https://freefire-community-efb6c-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const ADMIN_CODE="FFADMIN2026";let listenersStarted=false;
function unlock(){if(document.getElementById('pass').value===ADMIN_CODE){sessionStorage.adminUnlocked='1';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadApps()}else document.getElementById('err').textContent='❌ رمز الإدارة غير صحيح'}
if(sessionStorage.adminUnlocked==='1'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadApps()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(v){const u=String(v||'').trim();try{const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function socialItems(a){const arr=Array.isArray(a.social)?a.social:Array.isArray(a.socials)?a.socials:[];return arr.map(x=>typeof x==='string'?x:(x&&x.url)||'').filter(Boolean)}
function socialHtml(a){return socialItems(a).map((u,i)=>{const link=safeUrl(u);return link?`<a class="social-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">🔗 ${esc((()=>{try{return new URL(link).hostname.replace('www.','')}catch(e){return 'حساب'}})())}</a>`:''}).join('')||'<span class="muted">لا توجد روابط</span>'}
function badgeInfo(t){return t==='check'?['✓','موثّق']:t==='v'?['V','مميز']:t==='f'?['F','محترف']:['','بدون شارة']}
function badgeButtons(id,current){return `<div class="badge-row">
<button class="btn badge-btn ${current==='check'?'active':''}" onclick="setBadge('${esc(id)}','check')">✓ توثيق</button>
<button class="btn badge-btn ${current==='v'?'active':''}" onclick="setBadge('${esc(id)}','v')">V مميز</button>
<button class="btn badge-btn ${current==='f'?'active':''}" onclick="setBadge('${esc(id)}','f')">F محترف</button>
<button class="btn badge-btn ${(!current||current==='none')?'active':''}" onclick="setBadge('${esc(id)}','none')">إزالة الشارة</button></div>`}
function renderApps(arr){
 let p=0,ok=0,r=0;arr.forEach(a=>a.status==='pending'?p++:a.status==='approved'?ok++:r++);document.getElementById('pending').textContent=p;document.getElementById('approved').textContent=ok;document.getElementById('rejected').textContent=r;
 const box=document.getElementById('list');if(!arr.length){box.innerHTML='<div class="empty">لا توجد طلبات حتى الآن.</div>';return}
 box.innerHTML=arr.map(a=>{const st=a.status||'pending';const badge=badgeInfo(a.badgeType||'none');return `<div class="card">
 <div class="head"><img class="avatar" src="${esc(a.image||'')}" onerror="this.style.opacity='.25'"><div><div class="name">${esc(a.name||'بدون اسم')} ${st==='approved'?'🏆':''}</div><div class="tag">@${esc(String(a.username||'').replace(/^@/,'')||'-')} • ${esc(a.country||'-')} • <span class="status ${esc(st)}">${st==='pending'?'قيد المراجعة':st==='approved'?'مقبول':'مرفوض'}</span></div></div></div>
 <div class="grid">
  <div class="item"><b>📱 طريقة التواصل</b>${esc(a.contact||'-')}</div>
  <div class="item"><b>🔗 حسابات السوشيال</b><div class="socials">${socialHtml(a)}</div></div>
  <div class="item"><b>📅 تاريخ الطلب</b>${a.createdAt?new Date(a.createdAt).toLocaleString('ar'):'-'}</div>
  <div class="item"><b>🆔 معرف المتقدم</b>${esc(a.applicantUid||'-')}</div>
 </div>
 <div class="item"><b>📝 نبذة عن المحتوى</b><div class="bio">${esc(a.bio||'لم يكتب نبذة.')}</div></div>
 <div style="margin-top:14px"><b style="color:#8d98aa;font-size:12px">🖼️ صورة حسابه على السوشيال ميديا</b><img class="creator-photo" src="${esc(a.image||'')}" onerror="this.style.opacity='.2'"></div>
 ${st==='approved'?`<div class="badge-box"><div class="badge-title">🛡️ التوثيق الحالي: <strong>${esc(badge[1])}</strong> ${badge[0]?`<span style="font-size:25px;margin-right:6px">${esc(badge[0])}</span>`:''}</div>${badgeButtons(a.id,a.badgeType||'none')}<div class="small-note">يمكنك تغيير الشارة أو إزالتها في أي وقت، وسيظهر التغيير تلقائيًا في بروفايل الصانع.</div></div>`:''}
 <div class="actions">${st==='pending'?`<button class="btn approve" onclick="setStatus('${esc(a.id)}','approved')">✅ قبول وتحويل لصانع محتوى</button><button class="btn reject" onclick="setStatus('${esc(a.id)}','rejected')">❌ رفض الطلب</button>`:''}${st==='approved'?`<button class="btn delete" onclick="deleteCreator('${esc(a.id)}')">🗑️ حذف صانع المحتوى نهائيًا</button>`:''}</div>
 </div>`}).join('');
}
function renderCreators(list){
 const box=document.getElementById('creatorsList');document.getElementById('verified').textContent=list.filter(c=>c.badgeType&&c.badgeType!=='none'||c.verified).length;
 if(!list.length){box.innerHTML='<div class="empty">لا يوجد صناع محتوى حاليًا.</div>';return}
 box.innerHTML=list.sort((a,b)=>(b.joinedAt||0)-(a.joinedAt||0)).map(c=>{const bi=badgeInfo(c.badgeType||'none');return `<div class="card"><div class="head"><img class="avatar" src="${esc(c.image||'')}" onerror="this.style.opacity='.25'"><div><div class="name">${esc(c.name||'صانع محتوى')} ${bi[0]?`<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ffd84d,#ff7a00);color:#111;font-weight:1000">${esc(bi[0])}</span>`:''}</div><div class="tag">@${esc(String(c.username||c.handle||'').replace(/^@/,''))} • ${esc(c.country||'-')} • <span class="status approved">مقبول</span></div></div></div><div class="grid"><div class="item"><b>📱 التواصل</b>${esc(c.contact||'-')}</div><div class="item"><b>🌐 الحسابات</b><div class="socials">${socialHtml(c)}</div></div><div class="item"><b>👥 المتابعون</b>${Number(c.followers||0).toLocaleString('ar')}</div><div class="item"><b>📅 انضم</b>${c.joinedAt?new Date(c.joinedAt).toLocaleString('ar'):'-'}</div></div><div class="badge-box"><div class="badge-title">🛡️ إدارة التوثيق</div>${badgeButtons(c.id,c.badgeType||'none')}<div class="small-note">الحالة الحالية: ${esc(bi[1])}</div></div><div class="actions"><button class="btn delete" onclick="deleteCreator('${esc(c.id)}')">🗑️ حذف صانع المحتوى نهائيًا</button></div></div>`}).join('');
}
async function loadApps(){
 try{
  const snap=await db.ref('creatorApplications').once('value');const arr=[];snap.forEach(x=>arr.push({...x.val(),id:x.key}));arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));renderApps(arr);
  const cs=await db.ref('creators').orderByChild('status').equalTo('approved').once('value');const creators=[];cs.forEach(x=>creators.push({...x.val(),id:x.val()?.id||x.key}));renderCreators(creators);
  if(!listenersStarted){listenersStarted=true;db.ref('creatorApplications').on('value',s=>{const a=[];s.forEach(x=>a.push({...x.val(),id:x.key}));a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));renderApps(a)});db.ref('creators').on('value',s=>{const a=[];s.forEach(x=>{const v=x.val();if(v&&v.status==='approved')a.push({...v,id:v.id||x.key})});renderCreators(a)});}
 }catch(e){document.getElementById('list').innerHTML='<div class="empty">⚠️ تعذر تحميل البيانات. تأكد من Firebase Rules.</div>';console.error(e)}
}
async function setStatus(id,status){
 if(!confirm(status==='approved'?'قبول هذا الطلب وتحويله إلى صانع محتوى؟':'رفض هذا الطلب؟'))return;
 try{const ref=db.ref('creatorApplications/'+id);const snap=await ref.once('value');const app=snap.val();if(!app)throw new Error('الطلب غير موجود');
  if(status==='approved'){
   const creator={id,applicantUid:app.applicantUid||'',ownerUid:app.applicantUid||'',uid:app.applicantUid||'',publisherId:app.applicantUid||'',name:app.name||'صانع محتوى',username:app.username||'',handle:app.username||'',image:app.image||'',country:app.country||'',contact:app.contact||'',socials:app.social||[],bio:app.bio||'',followers:0,rooms:0,tournaments:0,points:0,badgeType:app.badgeType||'none',verified:false,status:'approved',joinedAt:Date.now()};
   await Promise.all([ref.update({status:'approved',reviewedAt:firebase.database.ServerValue.TIMESTAMP}),db.ref('creators/'+id).set(creator)]);
   alert('🎉 تم قبول الطلب وأصبح صانع محتوى.');
  }else{await Promise.all([ref.update({status:'rejected',reviewedAt:firebase.database.ServerValue.TIMESTAMP}),db.ref('creators/'+id).remove()]);alert('❌ تم رفض الطلب.');}
  await loadApps();
 }catch(e){alert('⚠️ تعذر حفظ القرار: '+(e.message||e));console.error(e)}
}
async function setBadge(id,badgeType){
 if(!['none','check','v','f'].includes(badgeType))return;
 const labels={none:'إزالة الشارة',check:'منح شارة التوثيق ✓',v:'منح شارة V المميزة',f:'منح شارة F الاحترافية'};
 if(!confirm('هل تريد '+labels[badgeType]+'؟'))return;
 try{await Promise.all([db.ref('creators/'+id).update({badgeType,verified:badgeType!=='none',badgeUpdatedAt:firebase.database.ServerValue.TIMESTAMP}),db.ref('creatorApplications/'+id).update({badgeType,verified:badgeType!=='none',badgeUpdatedAt:firebase.database.ServerValue.TIMESTAMP})]);alert('✅ تم تحديث التوثيق.');await loadApps()}catch(e){alert('⚠️ تعذر تحديث التوثيق: '+(e.message||e))}
}
async function deleteCreator(id){
 if(!confirm('⚠️ حذف صانع المحتوى نهائيًا؟\nسيختفي من قسم صناع المحتوى، وتختفي صفحته وزر البروفايل عنه، وسيُحذف طلبه من لوحة الإدارة.'))return;
 try{await Promise.all([db.ref('creators/'+id).remove(),db.ref('creatorApplications/'+id).remove()]);alert('🗑️ تم حذف صانع المحتوى نهائيًا من الموقع والإدارة.');await loadApps()}catch(e){alert('⚠️ تعذر الحذف: '+(e.message||e));console.error(e)}
}
</script>
</body></html>
