function showToast(message, type = 'success', duration = 3500) {
    const container = document.getElementById('toastContainer');
    let icon = 'fa-check-circle';
    if (type === 'error') icon = 'fa-times-circle';
    if (type === 'info') icon = 'fa-info-circle';
    
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
        <span class="toast-icon"><i class="fas ${icon}"></i></span>
        <span>${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
    `;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    const timeout = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
    }, duration);
    toast._timeout = timeout;
    toast.querySelector('.toast-close').addEventListener('click', () => {
        clearTimeout(timeout);
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
    });
}

function getPublisherId() {
    let id = localStorage.getItem('publisherId');
    if (!id) {
        id = 'pub_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('publisherId', id);
    }
    return id;
}

function getFlag(country) {
    const map = {
        'المغرب': '🇲🇦', 'مصر': '🇪🇬', 'السعودية': '🇸🇦', 'العراق': '🇮🇶',
        'الأردن': '🇯🇴', 'تونس': '🇹🇳', 'الجزائر': '🇩🇿', 'ليبيا': '🇱🇾',
        'سوريا': '🇸🇾', 'فلسطين': '🇵🇸', 'لبنان': '🇱🇧', 'الإمارات': '🇦🇪',
        'قطر': '🇶🇦', 'الكويت': '🇰🇼', 'عُمان': '🇴🇲', 'البحرين': '🇧🇭', 'اليمن': '🇾🇪',
        'جيبوتي': '🇩🇯', 'الصومال': '🇸🇴', 'جزر القمر': '🇰🇲', 'موريتانيا': '🇲🇷', 'السودان': '🇸🇩'
    };
    return map[country] || '🌍';
}

function getGenderIcon(gender) {
    if (gender === 'male') return '👨';
    if (gender === 'female') return '👩';
    return '';
}

function getGenderClass(gender) {
    if (gender === 'male') return 'male';
    if (gender === 'female') return 'female';
    return 'default';
}

function getTimeLeft(createdAt) {
    const elapsed = Date.now() - createdAt;
    const remaining = ROOM_LIFETIME - elapsed;
    if (remaining <= 0) return 'انتهت';
    const minutes = Math.floor(remaining / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);
    return `${minutes} min ${seconds.toString().padStart(2, '0')} s`;
}

document.querySelectorAll('.gender-filter .gf-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.gender-filter .gf-btn').forEach(b => {
            b.className = 'gf-btn';
        });
        const gender = this.dataset.gender;
        this.classList.add('active-' + gender);
        currentGenderFilter = gender;
        applyFilter();
    });
});

const countryList = [
    { value: 'all', label: '🌍 الكل' },
    { value: 'المغرب', label: '🇲🇦 المغرب' },
    { value: 'مصر', label: '🇪🇬 مصر' },
    { value: 'السعودية', label: '🇸🇦 السعودية' },
    { value: 'العراق', label: '🇮🇶 العراق' },
    { value: 'الأردن', label: '🇯🇴 الأردن' },
    { value: 'تونس', label: '🇹🇳 تونس' },
    { value: 'الجزائر', label: '🇩🇿 الجزائر' },
    { value: 'ليبيا', label: '🇱🇾 ليبيا' },
    { value: 'سوريا', label: '🇸🇾 سوريا' },
    { value: 'فلسطين', label: '🇵🇸 فلسطين' },
    { value: 'لبنان', label: '🇱🇧 لبنان' },
    { value: 'الإمارات', label: '🇦🇪 الإمارات' },
    { value: 'قطر', label: '🇶🇦 قطر' },
    { value: 'الكويت', label: '🇰🇼 الكويت' },
    { value: 'عُمان', label: '🇴🇲 عُمان' },
    { value: 'البحرين', label: '🇧🇭 البحرين' },
    { value: 'اليمن', label: '🇾🇪 اليمن' },
    { value: 'جيبوتي', label: '🇩🇯 جيبوتي' },
    { value: 'الصومال', label: '🇸🇴 الصومال' },
    { value: 'جزر القمر', label: '🇰🇲 جزر القمر' },
    { value: 'موريتانيا', label: '🇲🇷 موريتانيا' },
    { value: 'السودان', label: '🇸🇩 السودان' }
];

function buildDropdown() {
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    let sorted = [...countryList];
    if (favoriteCountry && favoriteCountry !== 'all') {
        sorted = sorted.filter(c => c.value !== 'all');
        const favIndex = sorted.findIndex(c => c.value === favoriteCountry);
        if (favIndex > -1) {
            const [favItem] = sorted.splice(favIndex, 1);
            sorted = [{ value: 'all', label: '🌍 الكل' }, favItem, ...sorted];
        } else {
            sorted = [{ value: 'all', label: '🌍 الكل' }, ...sorted];
        }
    } else {
        sorted = [{ value: 'all', label: '🌍 الكل' }, ...sorted.filter(c => c.value !== 'all')];
    }

    sorted.forEach(item => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.dataset.value = item.value;
        const isFavorite = (favoriteCountry === item.value && item.value !== 'all');
        const starClass = isFavorite ? 'star-icon favorite' : 'star-icon';
        const starIcon = item.value !== 'all' 
            ? `<span class="${starClass}" data-value="${item.value}"><i class="fas fa-star"></i></span>` 
            : '';
        div.innerHTML = `<span>${item.label}</span>${starIcon}`;
        div.addEventListener('click', function(e) {
            if (e.target.closest('.star-icon')) return;
            const val = this.dataset.value;
            currentFilter = val;
            updateSelectedDisplay();
            applyFilter();
            closeDropdown();
        });
        const star = div.querySelector('.star-icon');
        if (star) {
            star.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.dataset.value;
                toggleFavorite(val);
            });
        }
        container.appendChild(div);
    });
}

function toggleFavorite(country) {
    if (favoriteCountry === country) {
        favoriteCountry = null;
        localStorage.removeItem('favCountry');
        showToast('تم إلغاء تحديد الدولة المفضلة', 'info');
    } else {
        favoriteCountry = country;
        localStorage.setItem('favCountry', country);
        showToast(`✅ تم تحديد ${country} كدولة مفضلة`, 'success');
    }
    buildDropdown();
    if (favoriteCountry) currentFilter = favoriteCountry;
    else currentFilter = 'all';
    updateSelectedDisplay();
    applyFilter();
    closeDropdown();
}

function updateSelectedDisplay() {
    const display = document.getElementById('selectedDisplay');
    const label = countryList.find(c => c.value === currentFilter);
    if (label) {
        display.innerHTML = `<span>${label.label}</span><span class="arrow"><i class="fas fa-chevron-down"></i></span>`;
    } else {
        display.innerHTML = `<span>🌍 الكل</span><span class="arrow"><i class="fas fa-chevron-down"></i></span>`;
    }
}

function toggleDropdown() {
    const options = document.getElementById('optionsContainer');
    const arrow = document.querySelector('.selected .arrow');
    options.classList.toggle('show');
    arrow.classList.toggle('open');
}

function closeDropdown() {
    const options = document.getElementById('optionsContainer');
    const arrow = document.querySelector('.selected .arrow');
    options.classList.remove('show');
    arrow.classList.remove('open');
}

function applyFilter() {
    let filtered = roomsData;
    if (currentFilter !== 'all') {
        filtered = roomsData.filter(room => room.country === currentFilter);
    }
    if (currentGenderFilter !== 'all') {
        filtered = filtered.filter(room => room.gender === currentGenderFilter);
    }
    renderRooms(filtered);
}

function isBanned(publisherId) {
    const localBanned = JSON.parse(localStorage.getItem('bannedUsers') || '[]');
    if (localBanned.includes(publisherId)) return true;
    let banned = false;
    bannedRef.once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            const bannedList = Object.values(data);
            if (bannedList.includes(publisherId)) {
                banned = true;
            }
        }
    });
    return banned;
}

roomsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        roomsData = Object.keys(data).map(key => ({
            firebaseKey: key,
            ...data[key]
        }));
        roomsData.sort((a, b) => b.createdAt - a.createdAt);
    } else {
        roomsData = [];
    }
    applyFilter();
});

function renderRooms(filteredRooms = null) {
    const list = document.getElementById('roomsList');
    const count = document.getElementById('roomsCount');
    const publisherId = getPublisherId();
    
    let data = filteredRooms || roomsData;
    const now = Date.now();
    data = data.filter(r => (now - r.createdAt) < ROOM_LIFETIME);

    if (data.length === 0) {
        list.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px 0; color:#555; font-size:15px;">
            <i class="fas fa-inbox" style="font-size:36px; display:block; margin-bottom:10px;"></i>
            لا توجد غرف حالياً<br><span style="font-size:13px; color:#444;">انشر غرفتك الآن</span>
        </div>`;
        count.textContent = '0';
        return;
    }

    count.textContent = data.length;

    list.innerHTML = data.map(room => {
        const flag = getFlag(room.country);
        const notes = room.notes ? room.notes.trim() : '';
        const timeLeft = getTimeLeft(room.createdAt);
        const isOwner = room.publisherId === publisherId;
        const views = room.views || 0;
        const genderIcon = getGenderIcon(room.gender);
        const genderClass = getGenderClass(room.gender);

        if (isBanned(room.publisherId)) return '';

        return `
            <div class="room-card ${genderClass}" onclick="openDetails('${room.firebaseKey}')">
                <div>
                    <span class="badge-country">${flag} ${room.country}</span>
                    <span class="badge-mode">${room.mode}</span>
                    ${genderIcon ? `<span class="badge-gender">${genderIcon}</span>` : ''}
                    ${isOwner ? '<span class="badge-owner">👑 مالك</span>' : ''}
                    <span class="room-views"><i class="fas fa-eye"></i> ${views}</span>
                </div>
                <div class="room-meta">
                    <span><i class="fas fa-server"></i> ${room.server}</span>
                </div>
                ${notes ? `<div class="room-notes"><i class="fas fa-pencil-alt"></i> ${notes}</div>` : ''}
                <div class="room-footer">
                    <span class="status"><i class="fas fa-circle"></i> نشطة</span>
                    <span class="time-left"><i class="far fa-clock"></i> ${timeLeft}</span>
                    <div>
                        <button class="btn-details" onclick="event.stopPropagation(); openDetails('${room.firebaseKey}')">
                            <i class="fas fa-eye"></i> عرض
                        </button>
                        <button class="btn-share" onclick="event.stopPropagation(); openShareModal('${room.firebaseKey}')">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        ${isOwner ? `<button class="btn-delete" onclick="event.stopPropagation(); deleteRoom('${room.firebaseKey}')">
                            <i class="fas fa-trash"></i>
                        </button>` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function openDetails(key) {
    const room = roomsData.find(r => r.firebaseKey === key);
    if (!room) return;
    
    const publisherId = getPublisherId();
    const isOwner = room.publisherId === publisherId;
    
    if (!viewedRooms[key]) {
        const newViews = (room.views || 0) + 1;
        roomsRef.child(key).update({ views: newViews });
        room.views = newViews;
        viewedRooms[key] = true;
        localStorage.setItem('viewedRooms', JSON.stringify(viewedRooms));
    }
    
    const modal = document.getElementById('detailsModal');
    const content = document.getElementById('detailsContent');
    const flag = getFlag(room.country);
    const timeLeft = getTimeLeft(room.createdAt);
    const ownerText = isOwner ? 'أخر' : 'آخر';
    const genderIcon = getGenderIcon(room.gender);
    const genderName = room.gender === 'male' ? 'ذكر' : room.gender === 'female' ? 'أنثى' : '';

    startTimer(room.createdAt);

    content.innerHTML = `
        <h2 class="modal-title"><i class="fa-solid fa-magnifying-glass"></i> تفاصيل الغرفة</h2>
        
        <div class="hero-details">
            <div class="rank-details">
                <div class="shield"><i class="fa-solid fa-shield-halved"></i></div>
            </div>
            <div class="hero-data-details">
                <div class="id-label">🆔 Room ID <span class="mini-id">ID</span></div>
                <div class="big-id">${room.roomId}</div>
                <div class="hero-line"></div>
                <div class="password-label"><i class="fa-solid fa-key"></i> كلمة السر</div>
                <div class="password">${room.password}</div>
            </div>
            <div class="copy-stack-details">
                <button class="copy-btn" onclick="copyText('${room.roomId}')">
                    <i class="fa-regular fa-clipboard"></i>
                </button>
                <button class="copy-btn" onclick="copyText('${room.password}')">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
        </div>
        
        <div class="details-grid-details">
            <div class="card blue">
                <div class="card-icon"><i class="fa-solid fa-globe"></i></div>
                <div class="card-content">
                    <span class="label">السيرفر</span>
                    <span class="value">${room.server}</span>
                </div>
            </div>
            <div class="card purple">
                <div class="card-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="card-content">
                    <span class="label">نمط اللعب</span>
                    <span class="value">${room.mode}</span>
                </div>
            </div>
            <div class="card green">
                <div class="card-icon"><i class="fa-solid fa-users"></i></div>
                <div class="card-content">
                    <span class="label">المشاهدات</span>
                    <span class="value">${room.views || 0}</span>
                </div>
            </div>
            <div class="card orange">
                <div class="card-icon"><i class="fa-regular fa-clock"></i></div>
                <div class="card-content">
                    <span class="label">الوقت المتبقي</span>
                    <span class="value" id="timeDisplay">${timeLeft}</span>
                </div>

            <div class="card wide yellow">
                <div class="card-icon"><i class="fa-solid fa-crown"></i></div>
                <div class="card-content">
                    <span class="label">المالك</span>
                    <span class="value" style="color:#ff9e0b">${ownerText}</span>
                </div>
            </div>
            <div class="card wide gray country">
                <div class="flag-icon">${flag}</div>
                <div class="card-content">
                    <span class="label">الدولة</span>
                    <span class="value">${room.country}</span>
                </div>
            </div>
            ${genderIcon ? `
            <div class="card wide" style="border-color:rgba(255,193,7,0.3); color:#ff9800; grid-column:1/-1; min-height:50px;">
                <div class="card-icon" style="font-size:20px;">${genderIcon}</div>
                <div class="card-content">
                    <span class="label">الجنس</span>
                    <span class="value" style="color:${room.gender === 'male' ? '#2196F3' : '#E91E63'};">${genderName}</span>
                </div>
            </div>
            ` : ''}
        </div>
        
        <div class="actions-details">
            <button class="action share" onclick="openShareModal('${room.firebaseKey}')">
                <i class="fa-solid fa-share-nodes"></i> مشاركة الغرفة
            </button>
            ${isOwner ? `<button class="action delete" onclick="deleteRoom('${room.firebaseKey}')">
                <i class="fa-solid fa-trash-can"></i> حذف الغرفة
            </button>` : ''}
        </div>
    `;
    modal.style.display = 'flex';
}

let timerInterval = null;

function startTimer(createdAt) {
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        const timeDisplay = document.getElementById('timeDisplay');
        if (!timeDisplay) {
            clearInterval(timerInterval);
            return;
        }
        const elapsed = Date.now() - createdAt;
        const remaining = ROOM_LIFETIME - elapsed;
        if (remaining <= 0) {
            timeDisplay.textContent = 'انتهت';
            clearInterval(timerInterval);
            return;
        }
        const minutes = Math.floor(remaining / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        timeDisplay.textContent = `${minutes} min ${seconds.toString().padStart(2, '0')} s`;
    }, 1000);
}

function openShareModal(key) {
    const room = roomsData.find(r => r.firebaseKey === key);
    if (!room) return;
    shareRoomKey = key;
    document.getElementById('shareModal').style.display = 'flex';
}

document.getElementById('shareWhatsAppBtn').addEventListener('click', () => {
    const room = roomsData.find(r => r.firebaseKey === shareRoomKey);
    if (!room) return;
    const msg = `🎮 غرفة FreeFire\n🆔 ID: ${room.roomId}\n🔑 كلمة السر: ${room.password}\n🌍 الدولة: ${room.country}\n🎯 النمط: ${room.mode}`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    document.getElementById('shareModal').style.display = 'none';
});

document.getElementById('shareFacebookBtn').addEventListener('click', () => {
    const room = roomsData.find(r => r.firebaseKey === shareRoomKey);
    if (!room) return;
    const msg = `🎮 غرفة FreeFire ID: ${room.roomId} | كلمة السر: ${room.password}`;
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent('https://freefire-romes.vercel.app')}&quote=${encodeURIComponent(msg)}`, '_blank');
    document.getElementById('shareModal').style.display = 'none';
});

document.getElementById('shareCopyBtn').addEventListener('click', () => {
    const room = roomsData.find(r => r.firebaseKey === shareRoomKey);
    if (!room) return;
    const msg = `🎮 غرفة FreeFire\n🆔 ID: ${room.roomId}\n🔑 كلمة السر: ${room.password}\n🌍 الدولة: ${room.country}\n🎯 النمط: ${room.mode}`;
    navigator.clipboard.writeText(msg).then(() => {
        showToast('✅ تم نسخ تفاصيل الغرفة', 'success');
        document.getElementById('shareModal').style.display = 'none';
    }).catch(() => {
        prompt('انسخ التفاصيل:', msg);
        document.getElementById('shareModal').style.display = 'none';
    });
});

function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
        showToast('✅ تم النسخ', 'success');
    }).catch(() => {
        const input = document.createElement('textarea');
        input.value = text;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('✅ تم النسخ', 'success');
    });
}

function deleteRoom(key) {
    if (!confirm('هل أنت متأكد من حذف هذه الغرفة؟')) return;
    roomsRef.child(key).remove().then(() => {
        showToast('🗑️ تم حذف الغرفة بنجاح', 'success');
    }).catch((error) => {
        showToast('❌ حدث خطأ: ' + error.message, 'error');
    });
}

document.getElementById('createRoomForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const country = document.getElementById('roomCountry').value;
    const gender = document.getElementById('roomGender').value;
    const roomId = document.getElementById('roomId').value.trim();
    const password = document.getElementById('roomPass').value.trim();
    const mode = document.getElementById('roomMode').value;
    const server = document.getElementById('roomServer').value;
    const notes = document.getElementById('roomNotes').value.trim();
    const publisherId = getPublisherId();

    if (isBanned(publisherId)) {
        showToast('⚠️ أنت محظور ولا يمكنك نشر غرف!', 'error');
        return;
    }

    if (!country) { showToast('⚠️ اختر دولتك', 'error'); return; }
    if (!gender) { showToast('⚠️ اختر جنسك', 'error'); return; }
    if (!roomId) { showToast('⚠️ أدخل Room ID', 'error'); return; }
    if (!password) { showToast('⚠️ أدخل كلمة السر', 'error'); return; }

    const userRooms = roomsData.filter(r => r.publisherId === publisherId);
    userRooms.forEach(r => {
        if (r.firebaseKey) {
            roomsRef.child(r.firebaseKey).remove();
        }
    });

    const newRoom = {
        roomId: roomId,
        password: password,
        mode: mode,
        country: country,
        gender: gender,
        server: server,
        notes: notes || '',
        createdAt: Date.now(),
        publisherId: publisherId,
        views: 0
    };

    roomsRef.push(newRoom).then(() => {
        closeModals();
        document.getElementById('createRoomForm').reset();
        showToast('✅ تم النشر! الغرفة نشطة لمدة 15 دقيقة', 'success');
    }).catch((error) => {
        showToast('❌ حدث خطأ: ' + error.message, 'error');
    });
});

function closeModals() {
    document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

document.querySelectorAll('.close-btn').forEach(btn => {
    btn.addEventListener('click', closeModals);
});

window.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal')) closeModals();
});

document.getElementById('openCreateModal').addEventListener('click', () => {
    document.getElementById('createModal').style.display = 'flex';
});

document.getElementById('refreshBtn').addEventListener('click', () => {
    roomsRef.once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            roomsData = Object.keys(data).map(key => ({
                firebaseKey: key,
                ...data[key]
            }));
            roomsData.sort((a, b) => b.createdAt - a.createdAt);
        } else {
            roomsData = [];
        }
        applyFilter();
        showToast('🔄 تم تحديث الغرف', 'info');
        const btn = document.getElementById('refreshBtn');
        btn.innerHTML = '<i class="fas fa-check"></i> تم';
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
        }, 1500);
    });
});

document.getElementById('customSelect').addEventListener('click', function(e) {
    if (e.target.closest('.star-icon')) return;
    toggleDropdown();
});

document.addEventListener('click', function(e) {
    const select = document.getElementById('customSelect');
    if (!select.contains(e.target)) closeDropdown();
});

const fav = localStorage.getItem('favCountry');
if (fav) {
    favoriteCountry = fav;
    currentFilter = fav;
}
buildDropdown();
updateSelectedDisplay();

bannedRef.once('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        const list = Object.values(data);
        localStorage.setItem('bannedUsers', JSON.stringify(list));
    }
});
</script>
