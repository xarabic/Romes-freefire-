<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeFire Rooms | غرف فريفاير</title>
    <link rel="icon" href="https://i.postimg.cc/Qts4QhXw/images.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0d0d; color: #f0f0f0; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 85px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
        header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a1a0a 100%);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6a00;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 900; }
        .logo span:first-child { color: #fff; }
        .logo span:last-child { color: #ff6a00; }
        .logo i { color: #ff6a00; margin-left: 5px; }
        .filter-area { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .filter-label { color: #888; font-size: 13px; }
        .custom-select {
            position: relative;
            min-width: 170px;
            background: #0d0d0d;
            border-radius: 30px;
            border: 1px solid #333;
            cursor: pointer;
            transition: 0.3s;
        }
        .custom-select:hover { border-color: #ff6a00; }
        .custom-select .selected {
            padding: 8px 14px;
            color: #ddd;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .custom-select .selected .arrow { color: #666; font-size: 12px; transition: 0.3s; }
        .custom-select .selected .arrow.open { transform: rotate(180deg); }
        .custom-select .options {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            left: 0;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            max-height: 250px;
            overflow-y: auto;
            z-index: 200;
            padding: 6px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .custom-select .options.show { display: block; }
        .custom-select .option-item {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ccc;
            font-size: 14px;
            transition: 0.2s;
            cursor: pointer;
        }
        .custom-select .option-item:hover { background: #2a2a2a; color: #fff; }
        .custom-select .option-item .star-icon {
            color: #555;
            font-size: 14px;
            transition: 0.2s;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
        }
        .custom-select .option-item .star-icon:hover { transform: scale(1.3); background: rgba(255, 179, 0, 0.15); }
        .custom-select .option-item .star-icon.favorite { color: #ffb300; }
        .refresh-btn {
            background: transparent;
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .refresh-btn:hover { background: #4caf50; color: #fff; }
        .admin-btn {
            background: transparent;
            border: 1px solid #ff6a00;
            color: #ff6a00;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }
        .admin-btn:hover { background: #ff6a00; color: #fff; }
        .rooms-section { padding: 15px 0 30px; flex: 1; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h3 { font-size: 18px; color: #4caf50; }
        .section-header .header-actions { display: flex; gap: 10px; align-items: center; }
        #roomsCount {
            background: #1a1a1a;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
            border: 1px solid #2a2a2a;
        }
        .rooms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .room-card {
            background: linear-gradient(145deg, #161616, #0d0d0d);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid #252525;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }
        .room-card:hover {
            transform: translateY(-3px);
            border-color: #ff6a0066;
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.12);
        }
        .room-card .badge-country {
            display: inline-block;
            background: #1a1a1a;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #333;
            color: #ddd;
        }
        .room-card .badge-mode {
            display: inline-block;
            background: #ff6a0011;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #ff6a00;
            border: 1px solid #ff6a0044;
            margin-right: 5px;
        }
        .room-card .badge-owner {
            display: inline-block;
            background: #ff6a0022;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #ff6a00;
            border: 1px solid #ff6a0066;
            margin-right: 5px;
            font-weight: bold;
        }
        .room-card .badge-admin {
            display: inline-block;
            background: #ff444422;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #ff4444;
            border: 1px solid #ff444466;
            margin-right: 5px;
        }
        .room-card .room-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: #999; margin: 6px 0 6px; }
        .room-card .room-meta i { margin-left: 3px; color: #666; }
        .room-card .room-notes {
            font-size: 13px;
            color: #aaa;
            background: #1a1a1a;
            padding: 4px 10px;
            border-radius: 8px;
            margin: 5px 0 8px;
            border-right: 2px solid #ff6a00;
            word-break: break-word;
        }
        .room-card .room-notes i { color: #ff6a00; margin-left: 4px; }
        .room-card .room-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #1a1a1a;
            flex-wrap: wrap;
            gap: 5px;
        }
        .room-card .room-footer .status { font-size: 12px; color: #4caf50; }
        .room-card .room-footer .status i { font-size: 8px; margin-left: 4px; }
        .room-card .room-footer .time-left {
            font-size: 11px;
            color: #ff6a00;
            background: rgba(255, 106, 0, 0.15);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid #ff6a0044;
        }
        .room-card .btn-details {
            background: linear-gradient(135deg, #ff6a00, #e65c00);
            border: none;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 12px;
        }
        .room-card .btn-details:hover { transform: scale(1.05); }
        .room-card .btn-delete {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.3s;
        }
        .room-card .btn-delete:hover { background: #ff4444; color: #fff; }
        .room-card .btn-ban {
            background: transparent;
            border: 1px solid #ff6a00;
            color: #ff6a00;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.3s;
        }
        .room-card .btn-ban:hover { background: #ff6a00; color: #fff; }

        .fab-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .btn-fab {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff6a00, #e65c00);
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 30px rgba(255, 106, 0, 0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-fab:hover { transform: scale(1.08); box-shadow: 0 8px 50px rgba(255, 106, 0, 0.7); }
        .btn-fab:active { transform: scale(0.95); }
        .fab-label {
            color: #888;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 3px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 500px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #2a2a2a;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 28px;
            color: #666;
            cursor: pointer;
            transition: 0.3s;
        }
        .close-btn:hover { color: #ff6a00; }
        .modal-content h2 { margin-bottom: 18px; text-align: center; font-size: 22px; }
        .modal-content h2 i { color: #ff6a00; margin-left: 8px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #bbb;
            font-size: 13px;
            font-weight: 600;
        }
        .form-group label i { margin-left: 5px; color: #ff6a00; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            color: #fff;
            font-size: 14px;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ff6a00;
            outline: none;
            box-shadow: 0 0 15px #ff6a0022;
        }
        .form-group textarea { resize: vertical; min-height: 50px; font-family: inherit; }
        .form-group .hint { font-size: 11px; color: #666; margin-top: 3px; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff6a00, #e65c00);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        .btn-submit:hover { transform: scale(1.02); box-shadow: 0 0 30px #ff6a0044; }
        .btn-submit i { margin-left: 8px; }
        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
        }
        .btn-danger:hover { box-shadow: 0 0 30px #ff444444; }
        .btn-success {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
        }
        .btn-success:hover { box-shadow: 0 0 30px #4caf5044; }

        .admin-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #1a1a1a;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #2a2a2a;
        }
        .admin-list-item .publisher-id {
            color: #aaa;
            font-size: 12px;
            direction: ltr;
            text-align: left;
        }
        .admin-list-item .btn-unban {
            background: transparent;
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .admin-list-item .btn-unban:hover { background: #4caf50; color: #fff; }

        #detailsContent .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 14px;
        }
        #detailsContent .detail-item span:first-child { color: #888; }
        #detailsContent .detail-item span:last-child {
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #detailsContent .detail-item .copy-icon {
            background: #2a2a2a;
            border: none;
            color: #ff6a00;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        #detailsContent .detail-item .copy-icon:hover { background: #ff6a00; color: #fff; transform: scale(1.1); }
        #detailsContent .detail-item .copy-icon.copied { background: #4caf50; color: #fff; }
        #detailsContent .detail-item .check-icon {
            color: #4caf50;
            font-size: 18px;
        }
        #detailsContent .detail-notes {
            background: #1a1a1a;
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
            border-right: 3px solid #ff6a00;
            color: #aaa;
            font-size: 14px;
        }
        footer {
            background: #0a0a0a;
            padding: 15px 0;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            margin-top: auto;
        }
        footer p { color: #555; font-size: 12px; }

        @media (max-width: 650px) {
            header { flex-direction: column; text-align: center; }
            .filter-area { justify-content: center; }
            .rooms-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 20px 16px; }
            .btn-fab { width: 58px; height: 58px; font-size: 28px; }
            .fab-container { bottom: 18px; }
            body { padding-bottom: 75px; }
        }
        @media (max-width: 450px) {
            .logo { font-size: 20px; }
            .custom-select { min-width: 140px; }
            .custom-select .selected { font-size: 12px; padding: 6px 10px; }
            .room-card { padding: 10px 12px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <i class="fas fa-fire"></i>
        <span>FreeFire</span><span>Rooms</span>
    </div>
    <div class="filter-area">
        <span class="filter-label"><i class="fas fa-flag"></i></span>
        <div class="custom-select" id="customSelect">
            <div class="selected" id="selectedDisplay">
                <span>🌍 الكل</span>
                <span class="arrow"><i class="fas fa-chevron-down"></i></span>
            </div>
            <div class="options" id="optionsContainer"></div>
        </div>
        <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
        <!-- زر إدارة يظهر فقط للمدير -->
        <div id="adminButtonContainer"></div>
    </div>
</header>

<section class="rooms-section">
    <div class="container">
        <div class="section-header">
            <h3>🟢 الغرف النشطة</h3>
            <div class="header-actions">
                <span id="roomsCount">0</span>
            </div>
        </div>
        <div id="roomsList" class="rooms-grid">
            <div style="grid-column:1/-1; text-align:center; padding:40px 0; color:#888;">
                <i class="fas fa-spinner fa-spin" style="font-size:24px; display:block; margin-bottom:10px; color:#ff6a00;"></i>
                جاري تحميل الغرف...
            </div>
        </div>
    </div>
</section>

<div class="fab-container">
    <button class="btn-fab" id="openCreateModal">
        <i class="fas fa-plus"></i>
    </button>
    <span class="fab-label">انشر غرفة</span>
</div>

<!-- ====== مودال النشر ====== -->
<div id="createModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2><i class="fas fa-fire"></i> نشر غرفة</h2>
        <form id="createRoomForm">
            <div class="form-group">
                <label><i class="fas fa-flag"></i> دولتك *</label>
                <select id="roomCountry" required>
                    <option value="">-- اختر دولتك --</option>
                    <option value="المغرب">🇲🇦 المغرب</option>
                    <option value="مصر">🇪🇬 مصر</option>
                    <option value="السعودية">🇸🇦 السعودية</option>
                    <option value="العراق">🇮🇶 العراق</option>
                    <option value="الأردن">🇯🇴 الأردن</option>
                    <option value="تونس">🇹🇳 تونس</option>
                    <option value="الجزائر">🇩🇿 الجزائر</option>
                    <option value="ليبيا">🇱🇾 ليبيا</option>
                    <option value="سوريا">🇸🇾 سوريا</option>
                    <option value="فلسطين">🇵🇸 فلسطين</option>
                    <option value="لبنان">🇱🇧 لبنان</option>
                    <option value="الإمارات">🇦🇪 الإمارات</option>
                    <option value="قطر">🇶🇦 قطر</option>
                    <option value="الكويت">🇰🇼 الكويت</option>
                    <option value="عُمان">🇴🇲 عُمان</option>
                    <option value="البحرين">🇧🇭 البحرين</option>
                    <option value="اليمن">🇾🇪 اليمن</option>
                    <option value="جيبوتي">🇩🇯 جيبوتي</option>
                    <option value="الصومال">🇸🇴 الصومال</option>
                    <option value="جزر القمر">🇰🇲 جزر القمر</option>
                    <option value="موريتانيا">🇲🇷 موريتانيا</option>
                    <option value="السودان">🇸🇩 السودان</option>
                </select>
                <div class="hint">اختر دولتك فقط</div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-hashtag"></i> Room ID *</label>
                <input type="text" id="roomId" placeholder="مثال: 587421" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-key"></i> كلمة السر *</label>
                <input type="text" id="roomPass" placeholder="أي رقم" required>
                <div class="hint">أي رقم (1، 100، 1234...)</div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-gamepad"></i> نمط اللعب</label>
                <select id="roomMode">
                    <option value="سولو">سولو</option>
                    <option value="ديو">ديو</option>
                    <option value="سكواد" selected>سكواد</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-server"></i> السيرفر</label>
                <select id="roomServer">
                    <option value="الشرق الأوسط">الشرق الأوسط</option>
                    <option value="أوروبا">أوروبا</option>
                    <option value="آسيا">آسيا</option>
                    <option value="أمريكا">أمريكا</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-pencil-alt"></i> معلومات إضافية</label>
                <textarea id="roomNotes" placeholder="مثلاً: ممنوع الهكر"></textarea>
                <div class="hint">أي معلومات مفيدة للزوار</div>
            </div>
            <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> انشر</button>
        </form>
    </div>
</div>

<!-- ====== مودال التفاصيل ====== -->
<div id="detailsModal" class="modal">
    <div class="modal-content" style="max-width:440px;">
        <span class="close-btn" id="closeDetailsModal">&times;</span>
        <div id="detailsContent"></div>
    </div>
</div>

<!-- ====== مودال لوحة التحكم (خاصة بالمدير) ====== -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeAdminModal">&times;</span>
        <h2><i class="fas fa-crown" style="color:#ffb300;"></i> لوحة التحكم</h2>
        
        <div id="adminLock">
            <div class="form-group">
                <label><i class="fas fa-lock"></i> كلمة مرور المدير</label>
                <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور">
            </div>
            <button class="btn-submit" id="adminLoginBtn"><i class="fas fa-unlock"></i> دخول</button>
        </div>
        
        <div id="adminPanel" style="display:none;">
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;">
                <button class="btn-submit" id="adminRefreshBtn" style="flex:1;"><i class="fas fa-sync-alt"></i> تحديث</button>
                <button class="btn-submit btn-danger" id="adminClearAllBtn" style="flex:1;"><i class="fas fa-trash-alt"></i> حذف الكل</button>
            </div>
            
            <h3 style="color:#ff6a00; margin-bottom:10px;">🚫 المستخدمين المحظورين</h3>
            <div id="bannedList"></div>
            
            <h3 style="color:#ff6a00; margin-top:15px; margin-bottom:10px;">📊 إحصائيات</h3>
            <div id="adminStats" style="color:#aaa; font-size:14px;"></div>
        </div>
    </div>
</div>

<footer>
    <div class="container">
        <p>© 2026 FreeFire Rooms - غير تابع لـ Garena</p>
    </div>
</footer>

<script>
// ============================================================
// 🔥 إعدادات Firebase
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyDrwLgV3VhX80MiJiXuuVv31wIsJBHAGmA",
    authDomain: "freefire-romes.firebaseapp.com",
    databaseURL: "https://freefire-romes-default-rtdb.firebaseio.com",
    projectId: "freefire-romes",
    storageBucket: "freefire-romes.firebasestorage.app",
    messagingSenderId: "798987864557",
    appId: "1:798987864557:web:51aa9a0b32e6214e81bfe4"
};
// ============================================================

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const roomsRef = database.ref('rooms');
const bannedRef = database.ref('bannedUsers');

let roomsData = [];
let favoriteCountry = null;
let currentFilter = 'all';
const ROOM_LIFETIME = 15 * 60 * 1000;
const ADMIN_PASSWORD = "admin123";

// ====== التحقق من المدير ======
function isAdmin() {
    return localStorage.getItem('isAdmin') === 'true';
}

// ====== تحديث زر الإدارة ======
function updateAdminButton() {
    const container = document.getElementById('adminButtonContainer');
    if (isAdmin()) {
        container.innerHTML = `<button class="admin-btn" id="adminBtn"><i class="fas fa-crown"></i> إدارة</button>`;
        document.getElementById('adminBtn').addEventListener('click', () => {
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminLock').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        });
    } else {
        container.innerHTML = '';
    }
}

const countryList = [
    { value: 'all', label: '🌍 الكل' },
    { value: 'المغرب', label: '🇲🇦 المغرب' },
    { value: 'مصر', label: '🇪🇬 مصر' },
    { value: 'السعودية', label: '🇸🇦 السعودية' },
    { value: 'العراق', label: '🇮🇶 العراق' },
    { value: 'الأردن', label: '🇯🇴 الأردن' },
    { value: 'تونس', label: '🇹🇳 تونس' },
    { value: 'الجزائر', label: '🇩🇿 الجزائر' },
    { value: 'ليبيا', label: '🇱🇾 ليبيا' },
    { value: 'سوريا', label: '🇸🇾 سوريا' },
    { value: 'فلسطين', label: '🇵🇸 فلسطين' },
    { value: 'لبنان', label: '🇱🇧 لبنان' },
    { value: 'الإمارات', label: '🇦🇪 الإمارات' },
    { value: 'قطر', label: '🇶🇦 قطر' },
    { value: 'الكويت', label: '🇰🇼 الكويت' },
    { value: 'عُمان', label: '🇴🇲 عُمان' },
    { value: 'البحرين', label: '🇧🇭 البحرين' },
    { value: 'اليمن', label: '🇾🇪 اليمن' },
    { value: 'جيبوتي', label: '🇩🇯 جيبوتي' },
    { value: 'الصومال', label: '🇸🇴 الصومال' },
    { value: 'جزر القمر', label: '🇰🇲 جزر القمر' },
    { value: 'موريتانيا', label: '🇲🇷 موريتانيا' },
    { value: 'السودان', label: '🇸🇩 السودان' }
];

function getPublisherId() {
    let id = localStorage.getItem('publisherId');
    if (!id) {
        id = 'pub_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('publisherId', id);
    }
    return id;
}

function getFlag(country) {
    const map = {
        'المغرب': '🇲🇦', 'مصر': '🇪🇬', 'السعودية': '🇸🇦', 'العراق': '🇮🇶',
        'الأردن': '🇯🇴', 'تونس': '🇹🇳', 'الجزائر': '🇩🇿', 'ليبيا': '🇱🇾',
        'سوريا': '🇸🇾', 'فلسطين': '🇵🇸', 'لبنان': '🇱🇧', 'الإمارات': '🇦🇪',
        'قطر': '🇶🇦', 'الكويت': '🇰🇼', 'عُمان': '🇴🇲', 'البحرين': '🇧🇭', 'اليمن': '🇾🇪',
        'جيبوتي': '🇩🇯', 'الصومال': '🇸🇴', 'جزر القمر': '🇰🇲', 'موريتانيا': '🇲🇷', 'السودان': '🇸🇩'
    };
    return map[country] || '🌍';
}

function getTimeLeft(createdAt) {
    const elapsed = Date.now() - createdAt;
    const remaining = ROOM_LIFETIME - elapsed;
    if (remaining <= 0) return 'انتهت';
    const minutes = Math.floor(remaining / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);
    return `${minutes}:${seconds.toString().padStart(2, '0')}`;
}

function buildDropdown() {
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    let sorted = [...countryList];
    if (favoriteCountry && favoriteCountry !== 'all') {
        sorted = sorted.filter(c => c.value !== 'all');
        const favIndex = sorted.findIndex(c => c.value === favoriteCountry);
        if (favIndex > -1) {
            const [favItem] = sorted.splice(favIndex, 1);
            sorted = [{ value: 'all', label: '🌍 الكل' }, favItem, ...sorted];
        } else {
            sorted = [{ value: 'all', label: '🌍 الكل' }, ...sorted];
        }
    } else {
        sorted = [{ value: 'all', label: '🌍 الكل' }, ...sorted.filter(c => c.value !== 'all')];
    }

    sorted.forEach(item => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.dataset.value = item.value;
        const isFavorite = (favoriteCountry === item.value && item.value !== 'all');
        const starClass = isFavorite ? 'star-icon favorite' : 'star-icon';
        const starIcon = item.value !== 'all' 
            ? `<span class="${starClass}" data-value="${item.value}"><i class="fas fa-star"></i></span>` 
            : '';
        div.innerHTML = `<span>${item.label}</span>${starIcon}`;
        div.addEventListener('click', function(e) {
            if (e.target.closest('.star-icon')) return;
            const val = this.dataset.value;
            currentFilter = val;
            updateSelectedDisplay();
            applyFilter();
            closeDropdown();
        });
        const star = div.querySelector('.star-icon');
        if (star) {
            star.addEventListener('click', function(e) {
                e.stopPropagation();
                const val = this.dataset.value;
                toggleFavorite(val);
            });
        }
        container.appendChild(div);
    });
}

function toggleFavorite(country) {
    if (favoriteCountry === country) {
        favoriteCountry = null;
        localStorage.removeItem('favCountry');
    } else {
        favoriteCountry = country;
        localStorage.setItem('favCountry', country);
    }
    buildDropdown();
    if (favoriteCountry) currentFilter = favoriteCountry;
    else currentFilter = 'all';
    updateSelectedDisplay();
    applyFilter();
    closeDropdown();
}

function updateSelectedDisplay() {
    const display = document.getElementById('selectedDisplay');
    const label = countryList.find(c => c.value === currentFilter);
    if (label) {
        display.innerHTML = `<span>${label.label}</span><span class="arrow"><i class="fas fa-chevron-down"></i></span>`;
    } else {
        display.innerHTML = `<span>🌍 الكل</span><span class="arrow"><i class="fas fa-chevron-down"></i></span>`;
    }
}

function toggleDropdown() {
    const options = document.getElementById('optionsContainer');
    const arrow = document.querySelector('.selected .arrow');
    options.classList.toggle('show');
    arrow.classList.toggle('open');
}

function closeDropdown() {
    const options = document.getElementById('optionsContainer');
    const arrow = document.querySelector('.selected .arrow');
    options.classList.remove('show');
    arrow.classList.remove('open');
}

function applyFilter() {
    let filtered = roomsData;
    if (currentFilter !== 'all') {
        filtered = roomsData.filter(room => room.country === currentFilter);
    }
    renderRooms(filtered);
}

function isBanned(publisherId) {
    const localBanned = JSON.parse(localStorage.getItem('bannedUsers') || '[]');
    if (localBanned.includes(publisherId)) return true;
    
    let banned = false;
    bannedRef.once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            const bannedList = Object.values(data);
            if (bannedList.includes(publisherId)) {
                banned = true;
            }
        }
    });
    return banned;
}

roomsRef.on('value', (snapshot) => {
    const data = snapshot.val();
    const publisherId = getPublisherId();
    
    if (data) {
        roomsData = Object.keys(data).map(key => ({
            firebaseKey: key,
            ...data[key]
        }));
        roomsData.sort((a, b) => b.createdAt - a.createdAt);
    } else {
        roomsData = [];
    }
    applyFilter();
});

function renderRooms(filteredRooms = null) {
    const list = document.getElementById('roomsList');
    const count = document.getElementById('roomsCount');
    const publisherId = getPublisherId();
    const admin = isAdmin();
    
    let data = filteredRooms || roomsData;
    const now = Date.now();
    data = data.filter(r => (now - r.createdAt) < ROOM_LIFETIME);

    if (data.length === 0) {
        list.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px 0; color:#555; font-size:15px;">
            <i class="fas fa-inbox" style="font-size:36px; display:block; margin-bottom:10px;"></i>
            لا توجد غرف حالياً<br><span style="font-size:13px; color:#444;">انشر غرفتك الآن</span>
        </div>`;
        count.textContent = '0';
        return;
    }

    count.textContent = data.length;

    list.innerHTML = data.map(room => {
        const flag = getFlag(room.country);
        const notes = room.notes ? room.notes.trim() : '';
        const timeLeft = getTimeLeft(room.createdAt);
        const isOwner = room.publisherId === publisherId;

        if (isBanned(room.publisherId)) return '';

        return `
            <div class="room-card" onclick="openDetails('${room.firebaseKey}')">
                <div>
                    <span class="badge-country">${flag} ${room.country}</span>
                    <span class="badge-mode">${room.mode}</span>
                    ${isOwner ? '<span class="badge-owner">👑 مالك</span>' : ''}
                    ${admin ? '<span class="badge-admin">🛡️ مدير</span>' : ''}
                </div>
                <div class="room-meta">
                    <span><i class="fas fa-server"></i> ${room.server}</span>
                </div>
                ${notes ? `<div class="room-notes"><i class="fas fa-pencil-alt"></i> ${notes}</div>` : ''}
                <div class="room-footer">
                    <span class="status"><i class="fas fa-circle"></i> نشطة</span>
                    <span class="time-left"><i class="far fa-clock"></i> ${timeLeft}</span>
                    <div>
                        <button class="btn-details" onclick="event.stopPropagation(); openDetails('${room.firebaseKey}')">
                            <i class="fas fa-eye"></i> عرض
                        </button>
                        ${(isOwner || admin) ? `<button class="btn-delete" onclick="event.stopPropagation(); deleteRoom('${room.firebaseKey}')">
                            <i class="fas fa-trash"></i>
                        </button>` : ''}
                        ${admin ? `<button class="btn-ban" onclick="event.stopPropagation(); banUser('${room.publisherId}')">
                            <i class="fas fa-ban"></i>
                        </button>` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function openDetails(key) {
    const room = roomsData.find(r => r.firebaseKey === key);
    if (!room) return;
    const modal = document.getElementById('detailsModal');
    const content = document.getElementById('detailsContent');
    const flag = getFlag(room.country);
    const timeLeft = getTimeLeft(room.createdAt);
    const publisherId = getPublisherId();
    const isOwner = room.publisherId === publisherId;

    content.innerHTML = `
        <h3 style="text-align:center; margin-bottom:15px;">🔍 تفاصيل الغرفة</h3>
        <div class="detail-item">
            <span>${flag} الدولة</span>
            <span>${room.country}</span>
        </div>
        <div class="detail-item">
            <span>🆔 Room ID</span>
            <span>
                <span style="color:#ff6a00; font-weight:700;">${room.roomId}</span>
                <button class="copy-icon" onclick="copyText('${room.roomId}', this)">
                    <i class="fas fa-copy"></i>
                </button>
            </span>
        </div>
        <div class="detail-item">
            <span>🔑 كلمة السر</span>
            <span>
                <span style="color:#ff6a00; font-weight:700;">${room.password}</span>
                ${isOwner ? '<span class="check-icon">✅</span>' : ''}
                <button class="copy-icon" onclick="copyText('${room.password}', this)">
                    <i class="fas fa-copy"></i>
                </button>
            </span>
        </div>
        <div class="detail-item">
            <span>🎮 النمط</span>
            <span>${room.mode}</span>
        </div>
        <div class="detail-item">
            <span>🌐 السيرفر</span>
            <span>${room.server}</span>
        </div>
        <div class="detail-item">
            <span>⏱ الوقت المتبقي</span>
            <span style="color:#ff6a00;">${timeLeft}</span>
        </div>
        <div class="detail-item">
            <span>👑 المالك</span>
            <span>${isOwner ? 'أنت ✅' : 'آخر'}</span>
        </div>
        ${room.notes ? `<div class="detail-notes"><i class="fas fa-pencil-alt" style="color:#ff6a00; margin-left:6px;"></i> ${room.notes}</div>` : ''}
        ${isAdmin() ? `<button class="btn-submit btn-danger" onclick="deleteRoom('${room.firebaseKey}')" style="margin-top:10px;">
            <i class="fas fa-trash"></i> حذف الغرفة (مدير)
        </button>` : ''}
    `;
    modal.style.display = 'flex';
}

function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = '<i class="fas fa-check"></i>';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-copy"></i>';
            btn.classList.remove('copied');
        }, 1500);
    }).catch(() => {
        prompt('انسخ النص:', text);
    });
}

function deleteRoom(key) {
    if (!isAdmin() && !confirm('هل أنت متأكد من حذف هذه الغرفة؟')) return;
    roomsRef.child(key).remove().then(() => {
        alert('✅ تم حذف الغرفة بنجاح!');
    }).catch((error) => {
        alert('❌ حدث خطأ: ' + error.message);
    });
}

function banUser(publisherId) {
    if (!isAdmin()) {
        alert('⚠️ هذه الخاصية للمدير فقط!');
        return;
    }
    if (!publisherId || publisherId === 'system') {
        alert('⚠️ لا يمكن حظر هذا المستخدم.');
        return;
    }
    if (confirm(`هل أنت متأكد من حظر هذا المستخدم؟\nID: ${publisherId}`)) {
        bannedRef.push(publisherId).then(() => {
            const localBanned = JSON.parse(localStorage.getItem('bannedUsers') || '[]');
            if (!localBanned.includes(publisherId)) {
                localBanned.push(publisherId);
                localStorage.setItem('bannedUsers', JSON.stringify(localBanned));
            }
            alert('✅ تم حظر المستخدم بنجاح!');
            roomsData.filter(r => r.publisherId === publisherId).forEach(r => {
                if (r.firebaseKey) roomsRef.child(r.firebaseKey).remove();
            });
            applyFilter();
        }).catch((error) => {
            alert('❌ حدث خطأ: ' + error.message);
        });
    }
}

function unbanUser(publisherId) {
    if (!isAdmin()) return;
    bannedRef.once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(key => {
                if (data[key] === publisherId) {
                    bannedRef.child(key).remove();
                }
            });
        }
    });
    let localBanned = JSON.parse(localStorage.getItem('bannedUsers') || '[]');
    localBanned = localBanned.filter(id => id !== publisherId);
    localStorage.setItem('bannedUsers', JSON.stringify(localBanned));
    alert('✅ تم إلغاء حظر المستخدم!');
    applyFilter();
}

document.getElementById('createRoomForm').addEventListener('submit', (e) => {
    e.preventDefault();

    const country = document.getElementById('roomCountry').value;
    const roomId = document.getElementById('roomId').value.trim();
    const password = document.getElementById('roomPass').value.trim();
    const mode = document.getElementById('roomMode').value;
    const server = document.getElementById('roomServer').value;
    const notes = document.getElementById('roomNotes').value.trim();
    const publisherId = getPublisherId();

    if (isBanned(publisherId)) {
        alert('⚠️ أنت محظور ولا يمكنك نشر غرف!');
        return;
    }

    if (!country) { alert('⚠️ اختر دولتك.'); return; }
    if (!roomId) { alert('⚠️ أدخل Room ID.'); return; }
    if (!password) { alert('⚠️ أدخل كلمة السر.'); return; }

    const userRooms = roomsData.filter(r => r.publisherId === publisherId);
    userRooms.forEach(r => {
        if (r.firebaseKey) {
            roomsRef.child(r.firebaseKey).remove();
        }
    });

    const newRoom = {
        roomId: roomId,
        password: password,
        mode: mode,
        country: country,
        server: server,
        notes: notes || '',
        createdAt: Date.now(),
        publisherId: publisherId
    };

    roomsRef.push(newRoom).then(() => {
        closeModals();
        document.getElementById('createRoomForm').reset();
        alert('✅ تم النشر! الغرفة ستكون نشطة لمدة 15 دقيقة.');
    }).catch((error) => {
        alert('❌ حدث خطأ: ' + error.message);
    });
});

function closeModals() {
    document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
}

document.querySelectorAll('.close-btn').forEach(btn => {
    btn.addEventListener('click', closeModals);
});

window.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal')) closeModals();
});

document.getElementById('openCreateModal').addEventListener('click', () => {
    document.getElementById('createModal').style.display = 'flex';
});

document.getElementById('refreshBtn').addEventListener('click', () => {
    roomsRef.once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            roomsData = Object.keys(data).map(key => ({
                firebaseKey: key,
                ...data[key]
            }));
            roomsData.sort((a, b) => b.createdAt - a.createdAt);
        } else {
            roomsData = [];
        }
        applyFilter();
        const btn = document.getElementById('refreshBtn');
        btn.innerHTML = '<i class="fas fa-check"></i> تم';
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث';
        }, 1500);
    });
});

document.getElementById('adminLoginBtn').addEventListener('click', () => {
    const password = document.getElementById('adminPassword').value;
    if (password === ADMIN_PASSWORD) {
        localStorage.setItem('isAdmin', 'true');
        document.getElementById('adminLock').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAdminPanel();
        updateAdminButton(); // تحديث زر الإدارة
    } else {
        alert('❌ كلمة مرور خاطئة!');
    }
});

document.getElementById('adminPassword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('adminLoginBtn').click();
    }
});

function loadAdminPanel() {
    const stats = document.getElementById('adminStats');
    const activeRooms = roomsData.filter(r => (Date.now() - r.createdAt) < ROOM_LIFETIME);
    stats.innerHTML = `
        <div>📊 الغرف النشطة: ${activeRooms.length}</div>
        <div>👥 إجمالي الغرف المنشورة: ${roomsData.length}</div>
        <div>👑 أنت مدير الموقع</div>
    `;

    bannedRef.once('value', (snapshot) => {
        const data = snapshot.val();
        const bannedList = document.getElementById('bannedList');
        if (data) {
            const list = Object.values(data);
            if (list.length === 0) {
                bannedList.innerHTML = '<div style="color:#666; text-align:center; padding:10px;">لا يوجد مستخدمين محظورين</div>';
                return;
            }
            bannedList.innerHTML = list.map(id => `
                <div class="admin-list-item">
                    <span class="publisher-id">${id}</span>
                    <button class="btn-unban" onclick="unbanUser('${id}')">إلغاء الحظر</button>
                </div>
            `).join('');
        } else {
            bannedList.innerHTML = '<div style="color:#666; text-align:center; padding:10px;">لا يوجد مستخدمين محظورين</div>';
        }
    });
}

document.getElementById('adminRefreshBtn').addEventListener('click', loadAdminPanel);

document.getElementById('adminClearAllBtn').addEventListener('click', () => {
    if (confirm('⚠️ هل أنت متأكد من حذف جميع الغرف؟ هذا لا يمكن التراجع عنه!')) {
        roomsRef.remove().then(() => {
            alert('✅ تم حذف جميع الغرف!');
            loadAdminPanel();
        }).catch((error) => {
            alert('❌ حدث خطأ: ' + error.message);
        });
    }
});

document.getElementById('customSelect').addEventListener('click', function(e) {
    if (e.target.closest('.star-icon')) return;
    toggleDropdown();
});

document.addEventListener('click', function(e) {
    const select = document.getElementById('customSelect');
    if (!select.contains(e.target)) closeDropdown();
});

const fav = localStorage.getItem('favCountry');
if (fav) {
    favoriteCountry = fav;
    currentFilter = fav;
}
buildDropdown();
updateSelectedDisplay();
updateAdminButton(); // تفعيل زر الإدارة

bannedRef.once('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        const list = Object.values(data);
        localStorage.setItem('bannedUsers', JSON.stringify(list));
    }
});
</script>

</body>
</html>
